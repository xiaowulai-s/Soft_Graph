name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 · 单元测试 · 冒烟 · 构建
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_GET_USE_PROXY: '0'

      - name: 类型检查（主进程 + 渲染层）
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 内核冒烟（真实扫描本机，验证端到端可用）
        run: npm run smoke
        continue-on-error: true
        # 冒烟会真实枚举注册表与扫描磁盘，在 CI runner 上可能因环境差异波动，
        # 因此作为「信号」而非门禁；失败会在日志中体现。

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: softgraph-out-${{ github.sha }}
          path: |
            out/**
            .tmp/bench/**
          retention-days: 7
          if-no-files-found: warn

  benchmark:
    name: 性能基准（非阻塞）
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    # 不写 `needs: verify`：三个非门禁作业原先挂在 verify 下面，
    # 而 verify 自 2026-09-13 起一直是红的 —— 结果它们从未在 CI 上真正跑过一次，
    # 「接入了基准 / 兼容探测 / E2E」就只停留在文件层面。各自都有 `npm ci`，独立可跑。

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: 快速基准
        run: npm run bench:quick

      - name: 上传基准报告
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.sha }}
          path: |
            docs/benchmarks/*.md
            .tmp/bench/latest.json
          retention-days: 30
          if-no-files-found: warn

  compat:
    name: 兼容探测（另一台 Windows 的基线 · C1 前置）
    runs-on: windows-latest
    timeout-minutes: 25
    # runner 机型随镜像版本变化，这一作业的定位是「产出可对比的基线数据」而非门禁。
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: 能力探测（含内核冒烟）
        run: npm run compat:probe -- --with-smoke

      - name: 签名预检（记录证书是否接入，不阻塞）
        run: node scripts/sign-check.mjs --precheck

      - name: 上传探测与签名报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-probe-${{ github.sha }}
          path: |
            .tmp/compat-*.json
            .tmp/sign-check.json
          retention-days: 30
          if-no-files-found: warn

  e2e:
    name: CDP 端到端（真实交互）
    runs-on: windows-latest
    timeout-minutes: 30
    # 自带 `npm ci` + `npm run build`，不依赖 verify 作业（见 benchmark 处的说明）
    # windows-latest runner 提供桌面会话，但 GUI 启动仍受 runner 环境影响，
    # 因此与 smoke 一样先作为「信号」而非门禁；稳定后去掉这行即可变成门禁。
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: 构建应用
        run: npm run build

      - name: 端到端（启动应用 → 等 CDP → 驱动交互 → 关闭）
        run: npm run e2e:ci -- --port 9222 --wait 90000

      - name: 上传端到端截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.sha }}
          path: .tmp/*.png
          retention-days: 7
          if-no-files-found: warn
