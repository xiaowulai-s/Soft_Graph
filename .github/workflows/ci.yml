name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 · 单元测试 · 冒烟 · 构建
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_GET_USE_PROXY: '0'

      - name: 类型检查（主进程 + 渲染层）
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 内核冒烟（真实扫描本机，验证端到端可用）
        run: npm run smoke
        continue-on-error: true
        # 冒烟会真实枚举注册表与扫描磁盘，在 CI runner 上可能因环境差异波动，
        # 因此作为「信号」而非门禁；失败会在日志中体现。

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: softgraph-out-${{ github.sha }}
          path: |
            out/**
            .tmp/bench/**
          retention-days: 7
          if-no-files-found: warn

  benchmark:
    name: 性能基准（非阻塞）
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    needs: verify

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: 快速基准
        run: npm run bench:quick

      - name: 上传基准报告
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.sha }}
          path: |
            docs/benchmarks/*.md
            .tmp/bench/latest.json
          retention-days: 30
          if-no-files-found: warn

  # v2.0.0 M0 未覆盖：CDP 端到端（需 GUI 会话与 --remote-debugging-port）。
  # 计划在 G1 阶段以 self-hosted Windows runner 或 xvfb 等价方案补齐。
